[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/whspr/whspr"

[workspace.dependencies]
# Internal crates
whspr-core = { path = "crates/whspr-core" }
whspr-asr = { path = "crates/whspr-asr" }
whspr-refine = { path = "crates/whspr-refine" }
whspr-audio = { path = "crates/whspr-audio" }
whspr-inject = { path = "crates/whspr-inject" }
whspr-config = { path = "crates/whspr-config" }

# Async runtime & traits
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync"] }
async-trait = "0.1"

# Errors & logging
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
file-rotate = "0.8"

# Serialization & config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
directories = "6.0"
uuid = { version = "1", features = ["v4"] }

# CLI
clap = { version = "4.6", features = ["derive"] }

# Networking
reqwest = { version = "0.13", features = ["json", "rustls"] }

# Audio
hound = "3.5"
rubato = "5.0"
cpal = "0.18"
rodio = "0.22"

# ASR / LLM backends
whisper-rs = "0.16"
llama-cpp-2 = "0.1"

# Input injection & clipboard
global-hotkey = "0.8"
enigo = "0.6"
arboard = "3.6"

# GUI
iced = "0.14"
tray-icon = "0.24"

# macOS-only: frontmost-application lookup (NSWorkspace) for J-04
# style-by-window -- populates `RefineContext.app_name` so the refiner knows
# which app a dictation is going into. Both crates are already in Cargo.lock
# via iced -> winit, so this adds no new dependency tree. Opted into
# whspr-app only under a `cfg(target_os = "macos")` target dependency (same
# leaf-crate pattern as `metal` below); non-mac builds never link it.
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

# HuggingFace model client (whspr-hf). All four pinned to rustls-friendly,
# default-features-off configs so nothing drags openssl/native-tls into the
# tree -- the Nix build stays free of new C system libraries.
#   - hf-hub: model download + local cache + listing. `tokio` for the async
#     API, `rustls-tls` so its reqwest uses rustls (not native-tls).
#   - oauth2: PKCE authorization-code flow. `reqwest` + `rustls-tls` for the
#     async token-exchange HTTP client, no native-tls.
#   - sysinfo: total/available RAM for the "fits your machine" badge. Only
#     the `system` feature (RAM/CPU); disk/network/component/user dropped.
#   - webbrowser: opens the system browser at the OAuth authorize URL.
hf-hub = { version = "0.4", default-features = false, features = [
    "tokio",
    "rustls-tls",
] }
oauth2 = { version = "5.0", default-features = false, features = [
    "reqwest",
    "rustls-tls",
] }
sysinfo = { version = "0.39", default-features = false, features = [
    "system",
] }
webbrowser = "1.0"

# macOS-only: queries the Metal default device's `recommendedMaxWorkingSetSize`
# (the unified-memory GPU budget) for the "fits your machine" badge, mirroring
# what LM Studio uses on Apple Silicon. Opted into `whspr-hf` only under a
# `cfg(target_os = "macos")` target dependency, so non-mac builds never link
# it (see `crates/whspr-hf/src/hardware/metal.rs`).
metal = "0.32"

# Windows-only: HKCU\...\Run autostart registry access. Opted into leaf crates
# (whspr-config) under a `cfg(target_os = "windows")` target dependency,
# mirroring the `metal` precedent above, so macOS/Linux/Nix builds never link
# it (see `crates/whspr-config/src/autostart.rs`).
winreg = "0.52"

# Windows-only: DXGI adapter query for the dedicated-VRAM GPU budget (the
# Windows analogue of `metal`'s working-set query). Opted into `whspr-hf` under
# a `cfg(target_os = "windows")` target dependency; features are selected at the
# opt-in site (see `crates/whspr-hf/src/hardware/dxgi.rs`).
windows = "0.58"

# Build-dep (whspr-setup): embeds an `asInvoker` application manifest so the
# installer isn't auto-elevated by Windows' "installer detection" heuristic (it
# installs per-user into %LOCALAPPDATA%, no admin needed) — the "...setup.exe"
# name would otherwise trigger a spurious UAC prompt. Pure-Rust, no external
# tooling; used from crates/whspr-setup/build.rs under cfg(windows).
embed-manifest = "1.4"

# Scripting (macros) - a crate opts in with features = ["luajit", "vendored"]
# to embed a JIT-compiled Lua engine; the vendored LuaJIT builds from source
# via the existing cmake/clang toolchain, so no new system library is needed.
mlua = { version = "0.10", default-features = false }

# Dev dependencies
assert_cmd = "2.2"
predicates = "3.1"
wiremock = "0.6"
tempfile = "3.27"
