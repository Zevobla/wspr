[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/whspr/whspr"

[workspace.dependencies]
# Internal crates
whspr-core = { path = "crates/whspr-core" }
whspr-asr = { path = "crates/whspr-asr" }
whspr-refine = { path = "crates/whspr-refine" }
whspr-audio = { path = "crates/whspr-audio" }
whspr-inject = { path = "crates/whspr-inject" }
whspr-config = { path = "crates/whspr-config" }

# Async runtime & traits
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync"] }
async-trait = "0.1"

# Errors & logging
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
file-rotate = "0.8"

# Serialization & config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
figment = "0.10"
directories = "6.0"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Networking
reqwest = { version = "0.13", features = ["json", "rustls"] }

# Audio
hound = "3.5"
rubato = "5.0"
cpal = "0.18"
rodio = "0.22"

# ASR / LLM backends
whisper-rs = "0.16"
llama-cpp-2 = "0.1"

# Input injection & clipboard
global-hotkey = "0.8"
enigo = "0.6"
arboard = "3.6"

# GUI
iced = "0.14"
tray-icon = "0.24"

# Active window detection (style-by-window, J-04) -- permissive crates
# only, one per platform. See whspr-app/src/active_window.rs's module doc
# for why active-win-pos-rs (GPL-tainted via its Linux hyprland backend)
# was replaced with these instead.
objc2-app-kit = "0.3"
windows-sys = "0.60"
x11rb = "0.13"

# GTK/GLib bindings for a real Linux system tray (B-11): tray-icon's Linux
# backend needs a live GLib main loop pumping on some thread to actually
# deliver menu-click events, which iced's winit backend does not run on
# its own. See whspr-app/src/tray.rs.
gtk = "0.18"
glib = "0.18"

# Dev dependencies
assert_cmd = "2.2"
predicates = "3.1"
insta = "1.48"
wiremock = "0.6"
tempfile = "3.27"
