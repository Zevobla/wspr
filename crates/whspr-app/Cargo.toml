[package]
name = "whspr-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "whspr-app"
path = "src/main.rs"

[dependencies]
# "tokio" enables iced's tokio-backed executor, so `Task`/`Subscription`
# futures run on a real tokio runtime -- needed to bridge to the async
# `whspr_core::Pipeline` and to tokio mpsc channels (hotkey events, pipeline
# state callbacks) from within iced's async world. "svg" turns on iced's
# resvg-backed `svg` widget, used to render the vendored Lucide line icons
# (see `crate::theme::icons`); it's a feature flag on the existing iced dep,
# pure-Rust (resvg), and needs no new workspace dependency or system library.
iced = { workspace = true, features = ["tokio", "svg"] }
whspr-core = { workspace = true, features = ["testkit"] }
whspr-inject.workspace = true
whspr-audio.workspace = true
whspr-asr.workspace = true
whspr-refine.workspace = true
whspr-config.workspace = true
# Not in the root workspace's [workspace.dependencies] -- this is the only
# crate that diarizes recordings, so it's declared directly here rather than
# growing the shared dependency set.
whspr-diarize = { path = "../whspr-diarize" }
# The in-app HuggingFace model client (Models tab): OAuth login, model
# download, installed-model scan, and the "fits your machine" badge. A leaf
# crate depending only on whspr-core + the HF/OS deps; opted in here the same
# way whspr-diarize is.
whspr-hf = { path = "../whspr-hf" }
# Turns a media URL (YouTube etc.) into a 16kHz-mono AudioBuffer via yt-dlp +
# ffmpeg, powering the Dictate screen's "Transcribe from URL" action. Not in
# the root workspace's [workspace.dependencies] -- declared directly here by
# path, the same way whspr-diarize/whspr-hf are (the GUI is its only consumer).
whspr-import = { path = "../whspr-import" }
tokio.workspace = true
tracing.workspace = true
# whspr-audio doesn't expose a device-listing helper (it only starts capture
# on the default input device), so the Hub's mic device list talks to cpal
# directly rather than growing whspr-audio's public API for one small list
# call. See the final report for the reasoning.
cpal.workspace = true
# Tolerant parsing of the (schema-less-to-us) JSONL history file.
serde_json.workspace = true
# Locates the platform data dir the history file would live in.
directories.workspace = true
# Native file-picker dialog for "pick a recording to diarize". Not in the
# root workspace's [workspace.dependencies] -- declared directly here.
rfd = "0.15"
# Start/stop sound cues (AG-05): synthesizes and plays a short tone, no
# bundled audio asset. See `crate::sound`.
rodio.workspace = true
# System tray icon (B-11, macOS/Windows only -- see `crate::tray`'s module
# doc for why Linux isn't implemented).
tray-icon.workspace = true
# Size-based log rotation (O-19). See `crate::logging`.
file-rotate.workspace = true
tracing-subscriber.workspace = true
# PNG encoder for the env-gated headless screenshot dev-path (see
# `crate::screenshot`): `WHSPR_SCREENSHOT=<path>` captures the Hub window to a
# PNG and exits. A leaf, pure-Rust dep declared directly here (not a shared
# workspace dependency) since it's this crate's dev/verification concern only.
png = "0.17"
# Cross-platform OS light/dark appearance detection (see `crate::system_theme`):
# boots the Hub into the system theme and polls for appearance changes. Only
# this crate renders a theme, so -- same precedent as `rfd`/`png` above --
# it's declared directly here rather than growing the shared workspace set
# (not in the root `[workspace.dependencies]`).
dark-light = "3.0"

[build-dependencies]
# Rasterizes `assets/icon.svg` into the window icon at build time (see
# `build.rs`) so only a vector lives in git. `resvg` re-exports the exact
# `usvg`/`tiny-skia` versions it needs (`resvg::usvg`, `resvg::tiny_skia`),
# and both are already in the lockfile via iced's `svg` feature above, so
# this pulls no new major dependency tree -- just the one crate, declared
# directly here (not a shared workspace dependency) since it's this crate's
# own build-time concern.
resvg = "0.45"

[dev-dependencies]
tempfile.workspace = true
# Synthesizes a throwaway WAV fixture for `speakers::run_diarize_scan`'s
# test, same as `whspr-cli`'s e2e tests do.
hound.workspace = true
