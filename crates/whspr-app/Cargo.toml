[package]
name = "whspr-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "whspr-app"
path = "src/main.rs"

[dependencies]
# "tokio" enables iced's tokio-backed executor, so `Task`/`Subscription`
# futures run on a real tokio runtime -- needed to bridge to the async
# `whspr_core::Pipeline` and to tokio mpsc channels (hotkey events, pipeline
# state callbacks) from within iced's async world.
iced = { workspace = true, features = ["tokio"] }
whspr-core = { workspace = true, features = ["testkit"] }
whspr-inject.workspace = true
whspr-audio.workspace = true
whspr-asr.workspace = true
whspr-refine.workspace = true
whspr-config.workspace = true
# Not in the root workspace's [workspace.dependencies] -- this is the only
# crate that diarizes recordings, so it's declared directly here rather than
# growing the shared dependency set.
whspr-diarize = { path = "../whspr-diarize" }
tokio.workspace = true
tracing.workspace = true
# whspr-audio doesn't expose a device-listing helper (it only starts capture
# on the default input device), so the Hub's mic device list talks to cpal
# directly rather than growing whspr-audio's public API for one small list
# call. See the final report for the reasoning.
cpal.workspace = true
# Tolerant parsing of the (schema-less-to-us) JSONL history file.
serde_json.workspace = true
# Locates the platform data dir the history file would live in.
directories.workspace = true
# Native file-picker dialog for "pick a recording to diarize". Not in the
# root workspace's [workspace.dependencies] -- declared directly here.
rfd = "0.15"
# Start/stop sound cues (AG-05): synthesizes and plays a short tone, no
# bundled audio asset. See `crate::sound`.
rodio.workspace = true
# System tray icon (B-11). See `crate::tray`.
tray-icon.workspace = true
# Size-based log rotation (O-19). See `crate::logging`.
file-rotate.workspace = true
tracing-subscriber.workspace = true

# Foreground-app detection (J-04, `crate::active_window`), one permissive
# crate per platform.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true, features = ["NSWorkspace", "NSRunningApplication"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

# `x11rb` backs `crate::active_window`'s X11 query; `gtk`/`glib` back
# `crate::tray`'s dedicated GLib-main-loop thread (see that module's doc
# comment for why Linux needs one).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
gtk.workspace = true
glib.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Synthesizes a throwaway WAV fixture for `speakers::run_diarize_scan`'s
# test, same as `whspr-cli`'s e2e tests do.
hound.workspace = true
