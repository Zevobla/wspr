[package]
name = "whspr-config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
whspr-core.workspace = true
serde.workspace = true
directories.workspace = true
toml.workspace = true
serde_json.workspace = true
uuid.workspace = true
# OS keystore for API keys / the HF token / the history-encryption key (P-06).
keyring.workspace = true
# AEAD crate; only used here for its `OsRng` re-export to generate the
# random history-encryption key (see `secrets::history_key`). The actual
# encryption/decryption of history entries is the app team's job, not
# whspr-config's.
chacha20poly1305.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The Windows "launch at login" entry (see `src/autostart.rs`) writes an
# `HKCU\...\Run` registry value; macOS/Linux use a plist / `.desktop` file
# and never link this. Mirrors `whspr-hf`'s macOS-only `metal` opt-in.
[target.'cfg(target_os = "windows")'.dependencies]
winreg.workspace = true
