[package]
name = "whspr-hf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
whspr-core.workspace = true
# Only the `system` feature (total/available RAM for the fit badge);
# disk/network/component/user are dropped to keep the build light.
sysinfo.workspace = true
# Model download + local cache; `tokio` feature for the async API,
# `rustls-tls` so its reqwest never links native-tls/openssl.
hf-hub.workspace = true
# The mpsc channel a caller can subscribe to for download progress.
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tempfile.workspace = true
