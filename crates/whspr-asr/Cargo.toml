[package]
name = "whspr-asr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
whspr-core.workspace = true
async-trait.workspace = true
reqwest = { version = "0.13", features = ["json", "rustls", "multipart"] }
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true }
whisper-rs.workspace = true

[dev-dependencies]
wiremock.workspace = true
tokio = { workspace = true, features = ["macros"] }

[features]
# Re-exports whspr-core's MockAsr for convenience; does not pull in any
# heavy ASR backend (whisper-rs etc land as their own opt-in deps later).
testkit = ["whspr-core/testkit"]
