[package]
name = "whspr-asr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
whspr-core.workspace = true
async-trait.workspace = true
reqwest = { version = "0.13", features = ["json", "rustls", "multipart"] }
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true }
whisper-rs.workspace = true

# macOS-only: compiles the Objective-C shim (src/apple_speech.m) that bridges
# to Apple's on-device SFSpeechRecognizer. Kept a leaf-crate, target-gated
# build dependency (like whspr-hf's `metal`) so non-mac builds never pull it.
[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dev-dependencies]
wiremock.workspace = true
tokio = { workspace = true, features = ["macros"] }
hound.workspace = true

[features]
# Re-exports whspr-core's MockAsr for convenience.
testkit = ["whspr-core/testkit"]
