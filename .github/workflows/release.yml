name: Release

# Cut a release by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# See docs/RELEASING.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  release-macos:
    runs-on: macos-14 # Apple Silicon (arm64)

    # Signing/notarization is OPTIONAL: the steps below run only if these
    # secrets are set on the repo. GitHub's `secrets` context can't be used
    # in `if:` directly, so they're surfaced as job env and the signing/notes
    # steps gate on `env.MACOS_CERTIFICATE != ''`. Absent -> ship UNSIGNED.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PWD: ${{ secrets.MACOS_NOTARY_PWD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Determine version from tag
        id: version
        # v0.1.0 -> 0.1.0
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: nix flake check (the gate)
        run: nix flake check --print-build-logs

      - name: Bundle macOS .app / .dmg / .zip
        # The script self-resolves ARCHIVO_DIR from the flake and pulls
        # resvg via `nix shell`, so it's run directly (top-level PATH has nix).
        run: ./scripts/bundle-macos.sh --version "${{ steps.version.outputs.version }}"

      - name: Sign & notarize (optional; only when signing secrets are present)
        if: env.MACOS_CERTIFICATE != ''
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APP="dist/whspr.app"
          ZIP="dist/whspr-${VERSION}-macos.zip"
          DMG="dist/whspr-${VERSION}-macos.dmg"

          # Import the signing certificate into a temporary keychain.
          KEYCHAIN="$RUNNER_TEMP/whspr-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          # Sign the bundle with the hardened runtime, then verify.
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Repackage the now-signed app.
          rm -f "$ZIP" "$DMG"
          ditto -c -k --keepParent "$APP" "$ZIP"
          hdiutil create -volname whspr -srcfolder "$APP" -ov -format UDZO "$DMG"

          # Notarize the dmg, then staple the ticket to dmg and app.
          xcrun notarytool submit "$DMG" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PWD" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler staple "$APP"
          # Re-zip so the stapled app ships in the zip too.
          rm -f "$ZIP"
          ditto -c -k --keepParent "$APP" "$ZIP"

      - name: Write release notes
        run: |
          set -eu
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "## whspr $VERSION"
            echo
            echo "macOS (Apple Silicon) build. Download \`whspr-${VERSION}-macos.dmg\`, open it, and drag **whspr** to Applications."
            echo
            if [ -z "${MACOS_CERTIFICATE:-}" ]; then
              echo "### Unsigned build"
              echo
              echo "This build is **not signed or notarized**, so Gatekeeper blocks it on first launch. Either right-click **whspr.app** and choose **Open**, or clear the quarantine flag:"
              echo
              echo '```sh'
              echo "xattr -dr com.apple.quarantine /Applications/whspr.app"
              echo '```'
            else
              echo "This build is signed with Developer ID and notarized by Apple."
            fi
          } > "$NOTES"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          cat "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        id: notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.notes }}
          fail_on_unmatched_files: true
          files: |
            dist/whspr-*-macos.dmg
            dist/whspr-*-macos.zip

  # release-windows: portable zip + MSI installer for win-x64.
  #
  # DORMANT (same as .github/workflows/windows.yml): this job cannot run until
  # GitHub Actions billing is restored on this repo. It is authored correctly
  # for when it does run. Nix-free: like windows.yml it provisions a native
  # Windows/MSVC toolchain, libclang and the pinned Archivo faces directly --
  # the Archivo fetch+hash-verify+ARCHIVO_DIR steps are reused verbatim.
  release-windows:
    runs-on: windows-latest

    # Use PowerShell Core for every `run:` step so hash verification, the
    # $GITHUB_ENV/$GITHUB_OUTPUT writes, and the bundle script behave
    # identically regardless of the runner's default shell.
    defaults:
      run:
        shell: pwsh

    # Authenticode signing is OPTIONAL, gated exactly like release-macos'
    # signing: the signtool step runs only if this secret is set on the repo.
    # GitHub's `secrets` context can't be used in `if:` directly, so it's
    # surfaced as job env and the signing step gates on
    # `env.WINDOWS_CERTIFICATE != ''`. Absent -> ship UNSIGNED.
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PWD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable) with the MSVC target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # The whisper-rs / llama-cpp-2 C/C++ tree is a slow first compile;
      # caching the target dir and registry keeps re-runs cheap.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-win-x64

      # whisper-rs and llama-cpp-2 run bindgen, which needs libclang.
      # windows-latest ships LLVM at C:\Program Files\LLVM; MSVC (VS2022) and
      # CMake are preinstalled. Export LIBCLANG_PATH for the later build step.
      - name: Point bindgen at libclang
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # crates/whspr-app/build.rs panics unless ARCHIVO_DIR holds the three
      # static Archivo faces. Nix fetches them by content hash for the macOS
      # build; here we fetch them at runtime and verify the SAME SHA-256s.
      # The .ttf files are NOT committed (see .gitignore) and there is no
      # build.rs network fetch -- the faces exist only for this job.
      - name: Provide Archivo faces and set ARCHIVO_DIR
        run: |
          $ErrorActionPreference = 'Stop'

          # Expected digests are Nix SRI base64: the raw 32-byte SHA-256,
          # base64-encoded. Get-FileHash returns HEX, which would never
          # compare equal to these -- so below we hash the file to raw bytes
          # and base64-encode THOSE, producing a value directly comparable to
          # the SRI base64 (no hex<->b64 conversion, no room for an
          # encoding-mismatch false pass).
          $faces = @(
            @{ Name = 'Archivo-Regular.ttf';   Sri = 'Wfv9ipu0EwG/6VDnsJf9QtUq8iSgd2HiwbLJWaTJz5o=' },
            @{ Name = 'Archivo-SemiBold.ttf';  Sri = 'ZZi27YFhWHZ6djO9+wHXja9UyrTNTZ08wM/ZlfRyMIM=' },
            @{ Name = 'Archivo-ExtraBold.ttf'; Sri = 'n/9nkirivDdqnlxtZE7r+MWxf2Kg845fAW5LfjkDZi8=' }
          )
          $baseUrl = 'https://raw.githubusercontent.com/Omnibus-Type/Archivo/master/fonts/ttf'

          $dir = Join-Path $env:RUNNER_TEMP 'archivo'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          foreach ($face in $faces) {
            $dest = Join-Path $dir $face.Name
            $url  = "$baseUrl/$($face.Name)"
            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $dest

            $bytes  = [System.IO.File]::ReadAllBytes($dest)
            $sha    = [System.Security.Cryptography.SHA256]::Create()
            try {
              $actual = [Convert]::ToBase64String($sha.ComputeHash($bytes))
            } finally {
              $sha.Dispose()
            }

            if ($actual -ne $face.Sri) {
              throw "SHA-256 mismatch for $($face.Name): expected $($face.Sri), got $actual"
            }
            Write-Host "Verified $($face.Name)  ($actual)"
          }

          "ARCHIVO_DIR=$dir" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Determine version from tag
        id: version
        # v0.1.0 -> 0.1.0
        run: |
          "version=$($env:GITHUB_REF_NAME -replace '^v','')" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Builds whspr-app and stages whspr-app.exe + the four sherpa/onnxruntime
      # DLLs into dist\whspr, then zips dist\whspr-<version>-x64.zip.
      - name: Bundle portable zip
        run: ./scripts/bundle-windows.ps1 -Version "${{ steps.version.outputs.version }}"

      # Build the per-user MSI from packaging/windows/whspr.wxs with the WiX
      # toolset (installed as a dotnet global tool). BundleDir points WiX at the
      # exe + DLLs the bundle step just staged; Version stamps the ProductVersion.
      - name: Build MSI (WiX)
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"

          $version   = '${{ steps.version.outputs.version }}'
          $bundleDir = (Resolve-Path 'dist/whspr').Path
          wix build packaging/windows/whspr.wxs `
            -arch x64 `
            -d Version=$version `
            -d "BundleDir=$bundleDir" `
            -o "dist/whspr-$version-x64.msi"

      # Authenticode signing is OPTIONAL (mirrors release-macos): runs only when
      # the cert secret is present. Signs the staged exe (then rebuilds the zip
      # so the signed exe ships) and the MSI. Absent -> both stay UNSIGNED and
      # SmartScreen warns on first run (see the release notes below).
      - name: Sign with Authenticode (optional; only when the cert secret is present)
        if: env.WINDOWS_CERTIFICATE != ''
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'

          # Decode the base64 PFX secret to a temporary file.
          $pfx = Join-Path $env:RUNNER_TEMP 'whspr-cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

          # Locate the newest signtool.exe from the installed Windows SDK(s).
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw 'signtool.exe not found in the Windows SDK' }

          $signArgs = @(
            'sign', '/f', $pfx, '/p', $env:WINDOWS_CERTIFICATE_PWD,
            '/fd', 'SHA256', '/tr', 'http://timestamp.digicert.com', '/td', 'SHA256'
          )

          # Sign the staged exe, then rebuild the portable zip so the signed
          # exe ships inside it.
          & $signtool.FullName @signArgs 'dist\whspr\whspr-app.exe'
          if ($LASTEXITCODE -ne 0) { throw "signtool failed on the exe (exit $LASTEXITCODE)" }
          $zip = "dist/whspr-$version-x64.zip"
          Remove-Item -LiteralPath $zip -Force
          Compress-Archive -Path 'dist/whspr' -DestinationPath $zip -CompressionLevel Optimal

          # Sign the MSI installer.
          & $signtool.FullName @signArgs "dist\whspr-$version-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed on the MSI (exit $LASTEXITCODE)" }

      - name: Write release notes
        id: notes
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $lines = @(
            "## whspr $version (Windows)",
            '',
            "Windows (x64) build. Install with ``whspr-$version-x64.msi`` (per-user, no admin), or unzip ``whspr-$version-x64.zip`` and run ``whspr-app.exe`` in place.",
            ''
          )
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            $lines += '### Unsigned build'
            $lines += ''
            $lines += 'This build is **not Authenticode-signed**, so Windows SmartScreen may warn on first run. Click **More info**, then **Run anyway**.'
          } else {
            $lines += 'This build is Authenticode-signed.'
          }
          $notes = $lines -join "`n"

          "notes<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $notes       | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF"        | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Uploads to the SAME release as release-macos (same tag). `append_body`
      # adds the Windows notes to the release body instead of replacing the
      # macOS notes.
      - name: Add Windows artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.notes }}
          append_body: true
          fail_on_unmatched_files: true
          files: |
            dist/whspr-*-x64.zip
            dist/whspr-*-x64.msi

  # release-windows-arm64: portable zip + MSI installer for win-arm64
  # (native Windows-on-ARM, aarch64-pc-windows-msvc).
  #
  # DORMANT (same as release-windows / .github/workflows/windows.yml): this job
  # cannot run until GitHub Actions billing is restored on this repo. It is
  # authored correctly for when it does. Nix-free: it provisions a native
  # Windows/MSVC + clang-cl toolchain, libclang and the pinned Archivo faces
  # directly -- the Archivo fetch+hash-verify+ARCHIVO_DIR step is reused verbatim.
  #
  # The arm64 TOOLCHAIN RECIPE is copied verbatim from windows.yml's
  # build-win-arm64 job (proven GREEN on a real Windows-on-ARM VM): the
  # windows-11-arm runner, clang-cl (ggml hard-errors on MSVC `cl` for ARM),
  # Ninja, CMake, LIBCLANG_PATH, and the cargo build run under `vcvarsall arm64`
  # with CMAKE_TOOLCHAIN_FILE=packaging/windows/arm64-clangcl.cmake,
  # CMAKE_GENERATOR=Ninja and CXXFLAGS=/EHsc. See that job's header for why each
  # piece is load-bearing. No OpenMP/onnxruntime handling: the arm64 binary is
  # self-contained (sherpa cfg'd out, openmp off), so the zip ships ZERO DLLs.
  #
  # FALLBACK: if windows-11-arm is unavailable (a newer, capacity-limited
  # runner), the same build can instead CROSS-BUILD from windows-latest via
  # `vcvarsall amd64_arm64` (x64-hosted ARM64 cross tools) before the identical
  # cargo/bundle steps. Only the native path is wired up here; the cross-build
  # is the documented fallback, not implemented.
  release-windows-arm64:
    runs-on: windows-11-arm

    # PowerShell Core for every `run:` step (hash verification and the
    # $GITHUB_ENV / $GITHUB_OUTPUT / $GITHUB_PATH writes), matching
    # release-windows. The bundle step overrides this to cmd so it can
    # `call vcvarsall.bat arm64` before invoking the bundler.
    defaults:
      run:
        shell: pwsh

    # Authenticode signing is OPTIONAL and gated on the SAME secret as the x64
    # job (release-windows). GitHub's `secrets` context can't be used in `if:`
    # directly, so it's surfaced as job env and the signing step gates on
    # `env.WINDOWS_CERTIFICATE != ''`. Absent -> ship UNSIGNED.
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PWD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable) with the ARM64 MSVC target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      # The whisper-rs / llama-cpp-2 C/C++ tree is a slow first compile;
      # caching the target dir and registry keeps re-runs cheap.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-win-arm64

      # The proven arm64 recipe needs clang-cl (from LLVM), Ninja and CMake on
      # PATH. The ARM64 runner image is leaner than windows-latest, so provision
      # them explicitly. choco writes their install dirs to the MACHINE PATH,
      # which a later step in the SAME job does NOT inherit automatically -- so
      # surface the LLVM and CMake bin dirs via GITHUB_PATH (Ninja's choco shim
      # lands in C:\ProgramData\chocolatey\bin, already on PATH).
      - name: Provision LLVM (clang-cl), Ninja and CMake
        run: |
          choco install -y --no-progress llvm ninja cmake
          if ($LASTEXITCODE -ne 0) { throw "choco install failed (exit $LASTEXITCODE)" }
          'C:\Program Files\LLVM\bin'  | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\Program Files\CMake\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # whisper-rs and llama-cpp-2 run bindgen, which needs libclang. Point it
      # at the LLVM we just installed (same C:\Program Files\LLVM\bin as x64).
      - name: Point bindgen at libclang
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # crates/whspr-app/build.rs panics unless ARCHIVO_DIR holds the three
      # static Archivo faces. Nix fetches them by content hash for the macOS
      # build; here we fetch them at runtime and verify the SAME SHA-256s.
      # The .ttf files are NOT committed (see .gitignore) and there is no
      # build.rs network fetch -- the faces exist only for this job.
      - name: Provide Archivo faces and set ARCHIVO_DIR
        run: |
          $ErrorActionPreference = 'Stop'

          # Expected digests are Nix SRI base64: the raw 32-byte SHA-256,
          # base64-encoded. Get-FileHash returns HEX, which would never
          # compare equal to these -- so below we hash the file to raw bytes
          # and base64-encode THOSE, producing a value directly comparable to
          # the SRI base64 (no hex<->b64 conversion, no room for an
          # encoding-mismatch false pass).
          $faces = @(
            @{ Name = 'Archivo-Regular.ttf';   Sri = 'Wfv9ipu0EwG/6VDnsJf9QtUq8iSgd2HiwbLJWaTJz5o=' },
            @{ Name = 'Archivo-SemiBold.ttf';  Sri = 'ZZi27YFhWHZ6djO9+wHXja9UyrTNTZ08wM/ZlfRyMIM=' },
            @{ Name = 'Archivo-ExtraBold.ttf'; Sri = 'n/9nkirivDdqnlxtZE7r+MWxf2Kg845fAW5LfjkDZi8=' }
          )
          $baseUrl = 'https://raw.githubusercontent.com/Omnibus-Type/Archivo/master/fonts/ttf'

          $dir = Join-Path $env:RUNNER_TEMP 'archivo'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          foreach ($face in $faces) {
            $dest = Join-Path $dir $face.Name
            $url  = "$baseUrl/$($face.Name)"
            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $dest

            $bytes  = [System.IO.File]::ReadAllBytes($dest)
            $sha    = [System.Security.Cryptography.SHA256]::Create()
            try {
              $actual = [Convert]::ToBase64String($sha.ComputeHash($bytes))
            } finally {
              $sha.Dispose()
            }

            if ($actual -ne $face.Sri) {
              throw "SHA-256 mismatch for $($face.Name): expected $($face.Sri), got $actual"
            }
            Write-Host "Verified $($face.Name)  ($actual)"
          }

          "ARCHIVO_DIR=$dir" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Determine version from tag
        id: version
        # v0.1.0 -> 0.1.0
        run: |
          "version=$($env:GITHUB_REF_NAME -replace '^v','')" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Builds whspr-app for arm64 and stages the portable zip
      # (whspr-<version>-arm64.zip). The arm64 binary is SELF-CONTAINED, so the
      # bundler stages the exe with NO adjacent DLLs (sherpa cfg'd out, openmp
      # off). The cargo build must run under the arm64 MSVC + clang-cl
      # environment (the windows.yml recipe), so this step uses cmd to `call
      # vcvarsall.bat arm64` and sets the CMAKE_* / CXXFLAGS env, then invokes
      # the pwsh bundler as a child (which inherits the batch env plus
      # ARCHIVO_DIR / LIBCLANG_PATH from earlier steps).
      - name: Bundle portable zip
        shell: cmd
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/packaging/windows/arm64-clangcl.cmake
          CMAKE_GENERATOR: Ninja
          CXXFLAGS: /EHsc
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" arm64
          if errorlevel 1 exit /b 1
          pwsh -File scripts/bundle-windows.ps1 -Version "${{ steps.version.outputs.version }}" -Target aarch64-pc-windows-msvc

      # Build the per-user MSI from packaging/windows/whspr.wxs for arm64. The
      # `-arch arm64` flag both marks the package platform Arm64 and sets
      # $(sys.BUILDARCH), which the .wxs uses to OMIT the x64-only
      # sherpa/onnxruntime DLLs (absent from the self-contained arm64 bundle).
      # BundleDir points WiX at the exe the bundle step just staged; Version
      # stamps the ProductVersion. (WiX is a managed dotnet global tool; it runs
      # on the runner's arm64 .NET runtime.)
      - name: Build MSI (WiX)
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"

          $version   = '${{ steps.version.outputs.version }}'
          $bundleDir = (Resolve-Path 'dist/whspr').Path
          wix build packaging/windows/whspr.wxs `
            -arch arm64 `
            -d Version=$version `
            -d "BundleDir=$bundleDir" `
            -o "dist/whspr-$version-arm64.msi"

      # Authenticode signing is OPTIONAL (mirrors release-windows): runs only
      # when the SAME cert secret is present. Signs the staged exe (then
      # rebuilds the zip so the signed exe ships) and the MSI. Absent -> both
      # stay UNSIGNED and SmartScreen warns on first run (see the notes below).
      - name: Sign with Authenticode (optional; only when the cert secret is present)
        if: env.WINDOWS_CERTIFICATE != ''
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'

          # Decode the base64 PFX secret to a temporary file.
          $pfx = Join-Path $env:RUNNER_TEMP 'whspr-cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

          # Locate signtool.exe from the installed Windows SDK. Prefer the
          # native arm64 build; fall back to the x64 build (runs under emulation
          # on Windows-on-ARM) if the arm64 tool is not present.
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\arm64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) {
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
          }
          if ($null -eq $signtool) { throw 'signtool.exe not found in the Windows SDK' }

          $signArgs = @(
            'sign', '/f', $pfx, '/p', $env:WINDOWS_CERTIFICATE_PWD,
            '/fd', 'SHA256', '/tr', 'http://timestamp.digicert.com', '/td', 'SHA256'
          )

          # Sign the staged exe, then rebuild the portable zip so the signed
          # exe ships inside it.
          & $signtool.FullName @signArgs 'dist\whspr\whspr-app.exe'
          if ($LASTEXITCODE -ne 0) { throw "signtool failed on the exe (exit $LASTEXITCODE)" }
          $zip = "dist/whspr-$version-arm64.zip"
          Remove-Item -LiteralPath $zip -Force
          Compress-Archive -Path 'dist/whspr' -DestinationPath $zip -CompressionLevel Optimal

          # Sign the MSI installer.
          & $signtool.FullName @signArgs "dist\whspr-$version-arm64.msi"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed on the MSI (exit $LASTEXITCODE)" }

      - name: Write release notes
        id: notes
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $lines = @(
            "## whspr $version (Windows on ARM)",
            '',
            "Windows (ARM64) build. Install with ``whspr-$version-arm64.msi`` (per-user, no admin), or unzip ``whspr-$version-arm64.zip`` and run ``whspr-app.exe`` in place.",
            ''
          )
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            $lines += '### Unsigned build'
            $lines += ''
            $lines += 'This build is **not Authenticode-signed**, so Windows SmartScreen may warn on first run. Click **More info**, then **Run anyway**.'
          } else {
            $lines += 'This build is Authenticode-signed.'
          }
          $notes = $lines -join "`n"

          "notes<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $notes       | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF"        | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Uploads to the SAME release as release-macos / release-windows (same
      # tag). `append_body` adds the arm64 notes to the release body instead of
      # replacing the macOS / x64 notes.
      - name: Add Windows arm64 artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.notes }}
          append_body: true
          fail_on_unmatched_files: true
          files: |
            dist/whspr-*-arm64.zip
            dist/whspr-*-arm64.msi
