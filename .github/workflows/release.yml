name: Release

# Cut a release by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# See docs/RELEASING.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  release-macos:
    runs-on: macos-14 # Apple Silicon (arm64)

    # Signing/notarization is OPTIONAL: the steps below run only if these
    # secrets are set on the repo. GitHub's `secrets` context can't be used
    # in `if:` directly, so they're surfaced as job env and the signing/notes
    # steps gate on `env.MACOS_CERTIFICATE != ''`. Absent -> ship UNSIGNED.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PWD: ${{ secrets.MACOS_NOTARY_PWD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Determine version from tag
        id: version
        # v0.1.0 -> 0.1.0
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: nix flake check (the gate)
        run: nix flake check --print-build-logs

      - name: Bundle macOS .app / .dmg / .zip
        # The script self-resolves ARCHIVO_DIR from the flake and pulls
        # resvg via `nix shell`, so it's run directly (top-level PATH has nix).
        run: ./scripts/bundle-macos.sh --version "${{ steps.version.outputs.version }}"

      - name: Sign & notarize (optional; only when signing secrets are present)
        if: env.MACOS_CERTIFICATE != ''
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APP="dist/whspr.app"
          ZIP="dist/whspr-${VERSION}-macos.zip"
          DMG="dist/whspr-${VERSION}-macos.dmg"

          # Import the signing certificate into a temporary keychain.
          KEYCHAIN="$RUNNER_TEMP/whspr-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          # Sign the bundle with the hardened runtime, then verify.
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Repackage the now-signed app.
          rm -f "$ZIP" "$DMG"
          ditto -c -k --keepParent "$APP" "$ZIP"
          hdiutil create -volname whspr -srcfolder "$APP" -ov -format UDZO "$DMG"

          # Notarize the dmg, then staple the ticket to dmg and app.
          xcrun notarytool submit "$DMG" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PWD" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler staple "$APP"
          # Re-zip so the stapled app ships in the zip too.
          rm -f "$ZIP"
          ditto -c -k --keepParent "$APP" "$ZIP"

      - name: Write release notes
        run: |
          set -eu
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "## whspr $VERSION"
            echo
            echo "macOS (Apple Silicon) build. Download \`whspr-${VERSION}-macos.dmg\`, open it, and drag **whspr** to Applications."
            echo
            if [ -z "${MACOS_CERTIFICATE:-}" ]; then
              echo "### Unsigned build"
              echo
              echo "This build is **not signed or notarized**, so Gatekeeper blocks it on first launch. Either right-click **whspr.app** and choose **Open**, or clear the quarantine flag:"
              echo
              echo '```sh'
              echo "xattr -dr com.apple.quarantine /Applications/whspr.app"
              echo '```'
            else
              echo "This build is signed with Developer ID and notarized by Apple."
            fi
          } > "$NOTES"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          cat "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        id: notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.notes }}
          fail_on_unmatched_files: true
          files: |
            dist/whspr-*-macos.dmg
            dist/whspr-*-macos.zip

  # release-windows: portable zip + MSI installer for win-x64.
  #
  # DORMANT (same as .github/workflows/windows.yml): this job cannot run until
  # GitHub Actions billing is restored on this repo. It is authored correctly
  # for when it does run. Nix-free: like windows.yml it provisions a native
  # Windows/MSVC toolchain, libclang and the pinned Archivo faces directly --
  # the Archivo fetch+hash-verify+ARCHIVO_DIR steps are reused verbatim.
  release-windows:
    runs-on: windows-latest

    # Use PowerShell Core for every `run:` step so hash verification, the
    # $GITHUB_ENV/$GITHUB_OUTPUT writes, and the bundle script behave
    # identically regardless of the runner's default shell.
    defaults:
      run:
        shell: pwsh

    # Authenticode signing is OPTIONAL, gated exactly like release-macos'
    # signing: the signtool step runs only if this secret is set on the repo.
    # GitHub's `secrets` context can't be used in `if:` directly, so it's
    # surfaced as job env and the signing step gates on
    # `env.WINDOWS_CERTIFICATE != ''`. Absent -> ship UNSIGNED.
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PWD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable) with the MSVC target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # The whisper-rs / llama-cpp-2 C/C++ tree is a slow first compile;
      # caching the target dir and registry keeps re-runs cheap.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-win-x64

      # whisper-rs and llama-cpp-2 run bindgen, which needs libclang.
      # windows-latest ships LLVM at C:\Program Files\LLVM; MSVC (VS2022) and
      # CMake are preinstalled. Export LIBCLANG_PATH for the later build step.
      - name: Point bindgen at libclang
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # crates/whspr-app/build.rs panics unless ARCHIVO_DIR holds the three
      # static Archivo faces. Nix fetches them by content hash for the macOS
      # build; here we fetch them at runtime and verify the SAME SHA-256s.
      # The .ttf files are NOT committed (see .gitignore) and there is no
      # build.rs network fetch -- the faces exist only for this job.
      - name: Provide Archivo faces and set ARCHIVO_DIR
        run: |
          $ErrorActionPreference = 'Stop'

          # Expected digests are Nix SRI base64: the raw 32-byte SHA-256,
          # base64-encoded. Get-FileHash returns HEX, which would never
          # compare equal to these -- so below we hash the file to raw bytes
          # and base64-encode THOSE, producing a value directly comparable to
          # the SRI base64 (no hex<->b64 conversion, no room for an
          # encoding-mismatch false pass).
          $faces = @(
            @{ Name = 'Archivo-Regular.ttf';   Sri = 'Wfv9ipu0EwG/6VDnsJf9QtUq8iSgd2HiwbLJWaTJz5o=' },
            @{ Name = 'Archivo-SemiBold.ttf';  Sri = 'ZZi27YFhWHZ6djO9+wHXja9UyrTNTZ08wM/ZlfRyMIM=' },
            @{ Name = 'Archivo-ExtraBold.ttf'; Sri = 'n/9nkirivDdqnlxtZE7r+MWxf2Kg845fAW5LfjkDZi8=' }
          )
          $baseUrl = 'https://raw.githubusercontent.com/Omnibus-Type/Archivo/master/fonts/ttf'

          $dir = Join-Path $env:RUNNER_TEMP 'archivo'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          foreach ($face in $faces) {
            $dest = Join-Path $dir $face.Name
            $url  = "$baseUrl/$($face.Name)"
            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $dest

            $bytes  = [System.IO.File]::ReadAllBytes($dest)
            $sha    = [System.Security.Cryptography.SHA256]::Create()
            try {
              $actual = [Convert]::ToBase64String($sha.ComputeHash($bytes))
            } finally {
              $sha.Dispose()
            }

            if ($actual -ne $face.Sri) {
              throw "SHA-256 mismatch for $($face.Name): expected $($face.Sri), got $actual"
            }
            Write-Host "Verified $($face.Name)  ($actual)"
          }

          "ARCHIVO_DIR=$dir" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Determine version from tag
        id: version
        # v0.1.0 -> 0.1.0
        run: |
          "version=$($env:GITHUB_REF_NAME -replace '^v','')" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
